[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverpir"
version = "0.1.0"
description = "CoverPIR implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24","scipy>=1.11","matplotlib>=3.7","psutil>=5.9","scikit-learn>=1.3","joblib>=1.3","phe>=1.5"]

[project.scripts]
coverpir = "coverpir.cli:main"

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=4.45"]

[tool.setuptools.packages.find]
where = ["src"]

